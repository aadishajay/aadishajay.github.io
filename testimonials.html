s="transition-all duration-700 ease-out translate-y-6 opacity-0 card card-hover relative mb-6 flex flex-col break-inside-avoid p-7"><span class="font-display absolute top-4 right-6 text-6xl leading-none text-accent-100 select-none dark:text-accent-500/15" aria-hidden="true">”</span><blockquote class="relative text-lg leading-relaxed text-zinc-700 dark:text-zinc-300"><p>Aadish is always the go to person for compelled technical issues or invocation
His attitude towards work is great that makes him a good asset for any organisation</p></blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-zinc-100 pt-5 dark:border-zinc-800"><img src="/airtable-images/attH8iDu2UZIMozSA.jpg" alt="Sambasivam" class="h-10 w-10 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900"/><div><p class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">Sambasivam</p><p class="text-xs text-zinc-500 dark:text-zinc-400">Manager<!-- --> at Tech Mahindra Ltd</p></div></figcaption></figure><figure style="transition-delay:0ms" class="transition-all duration-700 ease-out translate-y-6 opacity-0 card card-hover relative mb-6 flex flex-col break-inside-avoid p-7"><span class="font-display absolute top-4 right-6 text-6xl leading-none text-accent-100 select-none dark:text-accent-500/15" aria-hidden="true">”</span><blockquote class="relative text-lg leading-relaxed text-zinc-700 dark:text-zinc-300"><p>It’s been really nice working with Aadish as he quickly catch up the points without explain in detail. The way code he write, properly aligned, commented and standard. Also he uses all the techniques to minimise the lines of code comparatively. </p></blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-zinc-100 pt-5 dark:border-zinc-800"><img src="/airtable-images/attl28P65Jc5unH9J.jpg" alt="Kalyanasundaram K" class="h-10 w-10 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900"/><div><p class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">Kalyanasundaram K</p><p class="text-xs text-zinc-500 dark:text-zinc-400">Team Lead<!-- --> at Tata Consultancy Service Ltd</p></div></figcaption></figure><figure style="transition-delay:0ms" class="transition-all duration-700 ease-out translate-y-6 opacity-0 card card-hover relative mb-6 flex flex-col break-inside-avoid p-7"><span class="font-display absolute top-4 right-6 text-6xl leading-none text-accent-100 select-none dark:text-accent-500/15" aria-hidden="true">”</span><blockquote class="relative text-lg leading-relaxed text-zinc-700 dark:text-zinc-300"><p>Aadish is result oriented and technically sound guy.</p></blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-zinc-100 pt-5 dark:border-zinc-800"><img src="/airtable-images/att7OtZhWsBOyDsQw.png" alt="Jitendra Raguwanshi" class="h-10 w-10 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900"/><div><p class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">Jitendra Raguwanshi</p><p class="text-xs text-zinc-500 dark:text-zinc-400">Client<!-- --> at Tata Consultancy Service Ltd</p></div></figcaption></figure><figure style="transition-delay:0ms" class="transition-all duration-700 ease-out translate-y-6 opacity-0 card card-hover relative mb-6 flex flex-col break-inside-avoid p-7"><span class="font-display absolute top-4 right-6 text-6xl leading-none text-accent-100 select-none dark:text-accent-500/15" aria-hidden="true">”</span><blockquote class="relative text-lg leading-relaxed text-zinc-700 dark:text-zinc-300"><p>Aadish&#x27;s ability to find logical solutions to complex business requirements is remarkable. The technical skillset that he possesses to implement them is equally impressive. He also finds time to learn a lot, not just about developments in technology, but also about general topics and happenings around the world that interest him. This makes collaborating with him a very pleasant experience; both at professional and personal levels.</p></blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-zinc-100 pt-5 dark:border-zinc-800"><img src="/airtable-images/attZVBSc0Wh5ilJGa.jpg" alt="Dheeraj" class="h-10 w-10 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900"/><div><p class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">Dheeraj</p><p class="text-xs text-zinc-500 dark:text-zinc-400">Colleague<!-- --> at Oracle India Pvt Ltd</p></div></figcaption></figure><figure style="transition-delay:0ms" class="transition-all duration-700 ease-out translate-y-6 opacity-0 card card-hover relative mb-6 flex flex-col break-inside-avoid p-7"><span class="font-display absolute top-4 right-6 text-6xl leading-none text-accent-100 select-none dark:text-accent-500/15" aria-hidden="true">”</span><blockquote class="relative text-lg leading-relaxed text-zinc-700 dark:text-zinc-300"><p>Aadish is a phenomenal person. I have had amazing experience while working along with him in several projects. His expertise in various technologies is commendable and the desire to pursue more skills is inspiring. He has mentored me in various ways which helped in my career growth eventually. And because of his great sense of humour he is the best company you can ask for, In short Aadish ticks all the boxes of being an exceptional colleague. </p></blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-zinc-100 pt-5 dark:border-zinc-800"><img src="/airtable-images/attF43GH7bIS0netW.jpg" alt="Srinivash Varma" class="h-10 w-10 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900"/><div><p class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">Srinivash Varma</p><p class="text-xs text-zinc-500 dark:text-zinc-400">Colleague<!-- --> at Oracle India Pvt Ltd</p></div></figcaption></figure><figure style="transition-delay:0ms" class="transition-all duration-700 ease-out translate-y-6 opacity-0 card card-hover relative mb-6 flex flex-col break-inside-avoid p-7"><span class="font-display absolute top-4 right-6 text-6xl leading-none text-accent-100 select-none dark:text-accent-500/15" aria-hidden="true">”</span><blockquote class="relative text-lg leading-relaxed text-zinc-700 dark:text-zinc-300"><p>He is very hardworking and proactive in his career</p></blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-zinc-100 pt-5 dark:border-zinc-800"><img src="/airtable-images/attFfGCxnlS2Is1KH.jpg" alt="Vandita Verma" class="h-10 w-10 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900"/><div><p class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">Vandita Verma</p><p class="text-xs text-zinc-500 dark:text-zinc-400">Colleague<!-- --> at Oracle India Pvt Ltd</p></div></figcaption></figure><figure style="transition-delay:0ms" class="transition-all duration-700 ease-out translate-y-6 opacity-0 card card-hover relative mb-6 flex flex-col break-inside-avoid p-7"><span class="font-display absolute top-4 right-6 text-6xl leading-none text-accent-100 select-none dark:text-accent-500/15" aria-hidden="true">”</span><blockquote class="relative text-lg leading-relaxed text-zinc-700 dark:text-zinc-300"><p>Aadish is very diligent and hard working. His attention to detail and understanding of the whole project is applauded by the team through several awards. He gives a simple and elegant solution for the tasks given to him. He is an excellent Lead and communicator and motivates each of the team members . He has a detailed knowledge on the projects he works on.His time management skills and critical thinking is excellent and he has managed many critical projects in our team.</p></blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-zinc-100 pt-5 dark:border-zinc-800"><img src="/airtable-images/attdLWKHzfQ3Qo0LU.jpg" alt="Chris Maria James" class="h-10 w-10 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900"/><div><p class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">Chris Maria James</p><p class="text-xs text-zinc-500 dark:text-zinc-400">Colleague<!-- --> at Oracle India Pvt Ltd</p></div></figcaption></figure><figure style="transition-delay:0ms" class="transition-all duration-700 ease-out translate-y-6 opacity-0 card card-hover relative mb-6 flex flex-col break-inside-avoid p-7"><span class="font-display absolute top-4 right-6 text-6xl leading-none text-accent-100 select-none dark:text-accent-500/15" aria-hidden="true">”</span><blockquote class="relative text-lg leading-relaxed text-zinc-700 dark:text-zinc-300"><p>Always helping technically and giving guidance to personally. </p></blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-zinc-100 pt-5 dark:border-zinc-800"><img src="/airtable-images/attt3tmPexhTgKbMs.jpg" alt="Uday Kumar" class="h-10 w-10 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900"/><div><p class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">Uday Kumar</p><p class="text-xs text-zinc-500 dark:text-zinc-400">Colleague<!-- --> at Tech Mahindra Ltd</p></div></figcaption></figure><figure style="transition-delay:0ms" class="transition-all duration-700 ease-out translate-y-6 opacity-0 card card-hover relative mb-6 flex flex-col break-inside-avoid p-7"><span class="font-display absolute top-4 right-6 text-6xl leading-none text-accent-100 select-none dark:text-accent-500/15" aria-hidden="true">”</span><blockquote class="relative text-lg leading-relaxed text-zinc-700 dark:text-zinc-300"><p>Great experience to work with him, always supportive , technically awesome.</p></blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-zinc-100 pt-5 dark:border-zinc-800"><img src="/airtable-images/attAHfqvfxn12iJMT.jpg" alt="Arit Bhattacharya" class="h-10 w-10 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900"/><div><p class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">Arit Bhattacharya</p><p class="text-xs text-zinc-500 dark:text-zinc-400">Colleague<!-- --> at Tech Mahindra Ltd</p></div></figcaption></figure><figure style="transition-delay:0ms" class="transition-all duration-700 ease-out translate-y-6 opacity-0 card card-hover relative mb-6 flex flex-col break-inside-avoid p-7"><span class="font-display absolute top-4 right-6 text-6xl leading-none text-accent-100 select-none dark:text-accent-500/15" aria-hidden="true">”</span><blockquote class="relative text-lg leading-relaxed text-zinc-700 dark:text-zinc-300"><p>Great individual who exhibits effortless leadership skills, both professionally and personally.
Extremely straightforward and approachable individual.</p></blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-zinc-100 pt-5 dark:border-zinc-800"><img src="/airtable-images/att55BBubCpIlaFEF.jpg" alt="Abhimanyu Pandey" class="h-10 w-10 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900"/><div><p class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">Abhimanyu Pandey</p><p class="text-xs text-zinc-500 dark:text-zinc-400">Colleague<!-- --> at Tata Consultancy Service Ltd</p></div></figcaption></figure><figure style="transition-delay:0ms" class="transition-all duration-700 ease-out translate-y-6 opacity-0 card card-hover relative mb-6 flex flex-col break-inside-avoid p-7"><span class="font-display absolute top-4 right-6 text-6xl leading-none text-accent-100 select-none dark:text-accent-500/15" aria-hidden="true">”</span><blockquote class="relative text-lg leading-relaxed text-zinc-700 dark:text-zinc-300"><p>Worked with Aadish for about 3 years. He has an exceptional technical skills along with insatiable thirst for new things, albeit from other module or technology.  He helped transition his acquired functional and technical skills to coworkers and new recruits ,thus balancing his dependency in the project.
He has a commendable people skills ergo he is approachable by anyone from leadership to trainee. </p></blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-zinc-100 pt-5 dark:border-zinc-800"><img src="/airtable-images/attSBJmoDEcpY0qcN.jpg" alt="Rajeshwar Krishnaraj" class="h-10 w-10 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900"/><div><p class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">Rajeshwar Krishnaraj</p><p class="text-xs text-zinc-500 dark:text-zinc-400">Colleague<!-- --> at Tata Consultancy Service Ltd</p></div></figcaption></figure><figure style="transition-delay:0ms" class="transition-all duration-700 ease-out translate-y-6 opacity-0 card card-hover relative mb-6 flex flex-col break-inside-avoid p-7"><span class="font-display absolute top-4 right-6 text-6xl leading-none text-accent-100 select-none dark:text-accent-500/15" aria-hidden="true">”</span><blockquote class="relative text-lg leading-relaxed text-zinc-700 dark:text-zinc-300"><p>Very passionate to work and good team player</p></blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-zinc-100 pt-5 dark:border-zinc-800"><img src="/airtable-images/attfORCWtsXXzQRc1.jpg" alt="Jayasimha " class="h-10 w-10 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900"/><div><p class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">Jayasimha </p><p class="text-xs text-zinc-500 dark:text-zinc-400">Colleague<!-- --> at Tata Consultancy Service Ltd</p></div></figcaption></figure><figure style="transition-delay:0ms" class="transition-all duration-700 ease-out translate-y-6 opacity-0 card card-hover relative mb-6 flex flex-col break-inside-avoid p-7"><span class="font-display absolute top-4 right-6 text-6xl leading-none text-accent-100 select-none dark:text-accent-500/15" aria-hidden="true">”</span><blockquote class="relative text-lg leading-relaxed text-zinc-700 dark:text-zinc-300"><p>Aadish has very sound knowledge of technical and functional aspects of products he has worked on. He has been always a go to person to get any help and he was equally interested to address your queries. In Short he was our &#x27;mini Google&#x27;. </p></blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-zinc-100 pt-5 dark:border-zinc-800"><img src="/airtable-images/attO1dCOXn38zIEXk.jpg" alt="Chetan Havale" class="h-10 w-10 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900"/><div><p class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">Chetan Havale</p><p class="text-xs text-zinc-500 dark:text-zinc-400">Colleague<!-- --> at Tata Consultancy Service Ltd</p></div></figcaption></figure><figure style="transition-delay:0ms" class="transition-all duration-700 ease-out translate-y-6 opacity-0 card card-hover relative mb-6 flex flex-col break-inside-avoid p-7"><span class="font-display absolute top-4 right-6 text-6xl leading-none text-accent-100 select-none dark:text-accent-500/15" aria-hidden="true">”</span><blockquote class="relative text-lg leading-relaxed text-zinc-700 dark:text-zinc-300"><p>I met Aadish when I just started my career. He was my colleague at first, where he used to share his sql queries and I being a DBA used to run those. Then he started teaching us plsql and sharing his knowledge being in the technology longer than us. At last before I left the organisation he had become an amazing friend with whom I used to have my lunch, go for rides, chill party etc who still keeps in touch with me.
Aadish is a strong willed person, with great subject knowledge and focus on anything he pursue. </p></blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-zinc-100 pt-5 dark:border-zinc-800"><img src="/airtable-images/attFLqOw8bLVMrze1.jpg" alt="Alen Thomas Varghese" class="h-10 w-10 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900"/><div><p class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">Alen Thomas Varghese</p><p class="text-xs text-zinc-500 dark:text-zinc-400">Colleague<!-- --> at Tata Consultancy Service Ltd</p></div></figcaption></figure><figure style="transition-delay:0ms" class="transition-all duration-700 ease-out translate-y-6 opacity-0 card card-hover relative mb-6 flex flex-col break-inside-avoid p-7"><span class="font-display absolute top-4 right-6 text-6xl leading-none text-accent-100 select-none dark:text-accent-500/15" aria-hidden="true">”</span><blockquote class="relative text-lg leading-relaxed text-zinc-700 dark:text-zinc-300"><p>It’s rare that you come across standout talent like Aadish. I was his colleague for almost 2 years and it was an experience worth it. He is an all-rounder. He has great hobbies and vision .He is also a great individual to work with and to hangout after office. The conversations that we had were thought provoking and he made sure that he pursued his ideas. I can guarantee that Aadish would be an asset to any project/team.</p></blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-zinc-100 pt-5 dark:border-zinc-800"><img src="/airtable-images/attmkIR5PPMQ3Ywe1.jpg" alt="Giridhar " class="h-10 w-10 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900"/><div><p class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">Giridhar </p><p class="text-xs text-zinc-500 dark:text-zinc-400">Colleague<!-- --> at Tata Consultancy Service Ltd</p></div></figcaption></figure></div></section><!--$--><!--/$--></main><footer class="border-t border-zinc-200/80
